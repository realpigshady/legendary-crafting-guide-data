name: build-pack

on:
  schedule:
    - cron: '17 4 * * 3'   # weekly build, Wednesday 04:17 UTC (after Tuesday game updates)
    - cron: '43 5 * * *'   # daily retry: only builds if latest pack is old or was stale
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the latest release (off = dry run: pack only as a run artifact)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tools/**', 'config/**', 'schema/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: build-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350   # under GitHub's 6 h job cap; the snapshot step still commits what was fetched
    env:
      # Scheduled/push runs publish only once the owner turns on repo variable AUTO_PUBLISH=true
      # (after the first live pack is reviewed). Manual runs: the 'publish' input.
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || vars.AUTO_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: pip install pytest && pytest -q tests

      - name: Probe wiki API
        run: |
          curl -sS -m 30 -A "legendary-crafting-guide-data pack generator (github.com/realpigshady/legendary-crafting-guide-data)" \
            -o probe.json -w "HTTP %{http_code} %{content_type}\n" \
            "https://wiki.guildwars2.com/api.php?action=query&meta=siteinfo&format=json" || true
          head -c 300 probe.json; echo
          W="https://wiki.guildwars2.com/api.php?format=json&formatversion=2&action=query"
          UA="legendary-crafting-guide-data pack generator (github.com/realpigshady/legendary-crafting-guide-data)"
          # family categories: do they exist and have members (a restored wiki can have empty category tables)
          python3 - <<'EOF' > cats.txt
          import json, urllib.parse
          for f in json.load(open("config/families.json"))["families"].values():
              c = f.get("wiki_category") if isinstance(f, dict) else None
              if c: print(urllib.parse.quote(c))
          EOF
          for c in $(cat cats.txt); do curl -sS -m 30 -A "$UA" "$W&prop=categoryinfo&titles=$c"; echo; sleep 1; done
          curl -sS -m 30 -A "$UA" "$W&list=search&srnamespace=14&srlimit=20&srsearch=legendary%20weapons"; echo; sleep 1
          curl -sS -m 30 -A "$UA" "$W&prop=categories&cllimit=50&titles=Nevermore"; echo

      - name: Fetch previous pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest -p pack.json -D prev || echo "no previous pack"

      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" != "43 5 * * *" ] || [ ! -f prev/pack.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          p = json.load(open("prev/pack.json"))
          age = dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(p["generated_at"])
          print("run=" + ("true" if p.get("stale_sources") or age.days >= 7 else "false"))
          EOF

      - name: Build pack
        if: steps.gate.outputs.run == 'true'
        run: |
          ARGS="--out dist"
          [ -f prev/pack.json ] && ARGS="$ARGS --previous prev/pack.json"
          python tools/build_pack.py $ARGS

      # The snapshot is the fallback when the wiki or API is down: rebuilding from it alone
      # must give the same pack, or an outage would publish a cut-down one.
      - name: Offline rebuild matches
        if: steps.gate.outputs.run == 'true'
        run: |
          python tools/build_pack.py --offline --out dist-offline
          python - <<'EOF'
          import json, sys
          a, b = (json.load(open(f"{d}/pack.json")) for d in ("dist", "dist-offline"))
          key = lambda p: (sorted(l["id"] for l in p["legendaries"]), sorted(json.dumps(n, sort_keys=True) for n in p["nodes"]))
          la, lb = len(a["legendaries"]), len(b["legendaries"])
          print(f"live: {la} legendaries, {len(a['nodes'])} nodes; offline: {lb}, {len(b['nodes'])}")
          if key(a) != key(b):
              print("::error::offline rebuild differs from the live pack: the snapshot is incomplete"); sys.exit(1)
          EOF

      # Keep every successful fetch, even if the build later fails, so the next
      # run (or an outage) has the freshest possible fallback.
      - name: Commit snapshot
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add snapshot
          git diff --cached --quiet || { git commit -m "snapshot: $(date -u +%F)" && git push; }

      # Warn (never fail) once snapshot/ passes 200 MB; the table goes to the run summary.
      - name: Snapshot size check
        if: always() && steps.gate.outputs.run == 'true'
        run: python tools/snapshot_size.py --warnings dist/warnings.txt

      - name: Upload pack for review
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pack
          path: dist/
          if-no-files-found: ignore

      - name: Publish
        if: success() && steps.gate.outputs.run == 'true' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pack-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" dist/pack.json dist/pack.json.sha256 dist/warnings.txt --title "$TAG" --notes-file dist/warnings.txt
          # Moving 'latest' release: the addon always downloads from here.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/pack.json dist/pack.json.sha256 --title "latest" --notes "Points to $TAG" --latest

      - name: Flag new legendaries
        if: success() && env.PUBLISH == 'true' && hashFiles('dist/new_legendaries.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "New legendaries detected" --body-file dist/new_legendaries.txt || true
