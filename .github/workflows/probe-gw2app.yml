name: probe gw2.app (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe_gw2app.py --out probe
      # results go to a throwaway branch (artifact downloads aren't reachable from the dev sandbox)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-gw2app
          git rm -rq --cached .
          git add -f probe
          git commit -qm "gw2.app probe output"
          git push -f origin probe-gw2app
