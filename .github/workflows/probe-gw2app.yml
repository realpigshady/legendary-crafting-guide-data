name: probe gw2.app (one-off)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe_gw2app.py --out probe
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
