name: export gw2.app (one-off, interim)
# TESTING-ONLY legendary-tree export while the GW2 wiki is down; never used in a release.
# Resumable: each run continues from export/state.json on the gw2app-export branch, saves,
# and dispatches the next run itself until the queue is empty. Polite: 1 page / 3 s, pages only.
on: workflow_dispatch
permissions:
  contents: write
  actions: write
concurrency:
  group: export-gw2app
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore progress
        run: |
          mkdir -p export
          if git fetch -q origin gw2app-export; then
            git show FETCH_HEAD:export/state.json > export/state.json || true
            git show FETCH_HEAD:export/gw2app.json > export/gw2app.json || true
          fi
          ls -la export
      - name: Crawl (about 75 minutes per run)
        run: python tools/export_gw2app.py --out export --max-pages 1500
      - name: Save progress
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s export/gw2app.json || { echo "nothing to save"; exit 0; }
          out="$RUNNER_TEMP/save"
          rm -rf "$out" && mkdir -p "$out" && cp -r export "$out/"
          cd "$out"
          git init -q -b gw2app-export
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export
          git commit -qm "gw2.app export progress"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gw2app-export
      - name: Continue if not finished
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          left=$(python -c "import json;print(len(json.load(open('export/state.json'))['queue']))")
          echo "queue left: $left"
          if [ "$left" -gt 0 ]; then gh workflow run export-gw2app.yml --ref "${GITHUB_REF_NAME}"; fi
